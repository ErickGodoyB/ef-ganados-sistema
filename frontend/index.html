<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#183d09" />
    <title>EF Ganados</title>
    <script>
      // Fija el tema (claro/oscuro) antes de que React se monte, para que
      // no haya un parpadeo con el tema equivocado al cargar la página.
      // Debe usar la misma clave y lógica que tema/TemaContext.jsx.
      (function () {
        try {
          var guardado = localStorage.getItem('ef-ganados.tema')
          var prefiereOscuro = window.matchMedia('(prefers-color-scheme: dark)').matches
          var tema = guardado || (prefiereOscuro ? 'oscuro' : 'claro')
          document.documentElement.setAttribute('data-tema', tema)
        } catch {
          document.documentElement.setAttribute('data-tema', 'claro')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
