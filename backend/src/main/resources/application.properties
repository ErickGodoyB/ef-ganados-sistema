spring.application.name=sistema-bovino
spring.datasource.url=jdbc:postgresql://localhost:5432/efganados
spring.datasource.username=postgres
spring.datasource.password=cameri1004
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true    
server.error.include-message=always
server.error.include-binding-errors=always

# Valores de DESARROLLO. En producción, reemplazar por secretos reales
# (variables de entorno o un gestor de secretos), nunca committear los
# definitivos en este archivo.
app.jwt.secret=sistema-bovino-clave-secreta-dev-2026
app.jwt.expiracion-horas=8
app.admin.usuario=admin
app.admin.password=cambiar-esta-clave

# Longitud mínima de una contraseña nueva (PUT /api/auth/clave). 5 es un
# valor de DESARROLLO para probar cómodo: subir a 8 o más antes de
# desplegar a producción.
app.seguridad.clave-minima=5

# Orígenes del frontend permitidos por CORS (lista separada por comas). Los
# patrones 192.168.*.* y 10.*.*.* son para poder probar desde un celular en
# la misma red wifi durante el desarrollo. En producción, reemplazar por el
# dominio real del frontend (nunca dejar patrones de IP de LAN/localhost).
app.cors.origenes-permitidos=http://localhost:5173,http://127.0.0.1:5173,http://192.168.*.*:5173,http://10.*.*.*:5173