spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Propiedades de autenticación para las pruebas. Este archivo reemplaza por
# completo al application.properties de main (no lo combina), así que la API
# de autenticación necesita sus propios valores acá; son solo de prueba, no
# los de producción.
app.jwt.secret=clave-secreta-de-prueba-para-tests-h2
app.jwt.expiracion-horas=8
app.admin.usuario=admin
app.admin.password=clave-de-prueba